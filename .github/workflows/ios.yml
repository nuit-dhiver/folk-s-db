name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default

      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          # Pick an iPhone simulator on the newest iOS runtime; the app requires iOS 26 or later
          device=`xcrun simctl list devices available --json | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"]; runtime = devices.keys.select { |k| k[/iOS-(\d+)/, 1].to_i >= 26 && devices[k].any? { |d| d["name"].start_with?("iPhone") } }.max_by { |k| k[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) }; abort "No iOS 26+ iPhone simulator" unless runtime; puts devices[runtime].find { |d| d["name"].start_with?("iPhone") }["udid"]'`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,id=$device"

      - name: Test
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          # Pick an iPhone simulator on the newest iOS runtime; the app requires iOS 26 or later
          device=`xcrun simctl list devices available --json | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"]; runtime = devices.keys.select { |k| k[/iOS-(\d+)/, 1].to_i >= 26 && devices[k].any? { |d| d["name"].start_with?("iPhone") } }.max_by { |k| k[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) }; abort "No iOS 26+ iPhone simulator" unless runtime; puts devices[runtime].find { |d| d["name"].start_with?("iPhone") }["udid"]'`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,id=$device"
